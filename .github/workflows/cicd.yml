name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ============================================================
  # Job 1 -- Code Quality Checks (Python & Prettier)
  # ============================================================
  code_quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python formatters
        run: |
          python -m pip install --upgrade pip
          python -m pip install autoflake black==25.11.0

      - name: Check Python Code Quality
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Running autoflake check ==="
          autoflake --remove-all-unused-imports --remove-unused-variables --recursive --check .
          echo "=== Running black check ==="
          black . --check

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Global Formatters
        run: npm install -g prettier prettier-plugin-solidity

      - name: Run Global Prettier Check
        shell: bash
        run: |
          set -euo pipefail
          NODE_GLOBAL=$(npm root -g)
          echo "=== Running Prettier check ==="
          prettier --plugin="$NODE_GLOBAL/prettier-plugin-solidity/dist/index.js" \
            --check "**/*.{js,jsx,ts,tsx,json,html,css,md,sol,yml,yaml}"

  # ====================================================================================
  # Job 2 -- Backend Test & Build (Pytest + import check + Docker image + smoke test)
  # ====================================================================================
  backend_test_build:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    env:
      BACKEND_DIR: code/backend
      IMAGE_NAME: blockguardian-backend:ci
      SECRET_KEY: ci-secret-key-min-32-characters-long-000
      JWT_SECRET_KEY: ci-jwt-secret-key-min-32-characters-000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: code/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f "${BACKEND_DIR}/requirements.txt" ]; then
            python -m pip install -r "${BACKEND_DIR}/requirements.txt"
          fi
          python -m pip install pytest pytest-cov pytest-asyncio

      - name: Run backend test suite
        working-directory: ${{ env.BACKEND_DIR }}
        run: |
          set -euo pipefail
          pytest tests/ \
            --tb=short \
            --strict-markers \
            -v \
            --cov=. \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: code/backend/coverage.xml
          retention-days: 30

      - name: Compile backend sources
        working-directory: ${{ env.BACKEND_DIR }}
        run: python -m compileall -q src

      - name: Verify application imports
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          FLASK_ENV: production
          DATABASE_URL: sqlite:////tmp/blockguardian-ci.db
        run: |
          set -euo pipefail
          python -c "from src.main import app; print(f'App import OK - {len(list(app.url_map.iter_rules()))} routes registered')"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: code/backend
          file: code/backend/Dockerfile
          target: production
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Smoke test backend container
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name backend-ci -p 5000:5000 \
            -e FLASK_ENV=production \
            -e SECRET_KEY="${SECRET_KEY}" \
            -e JWT_SECRET_KEY="${JWT_SECRET_KEY}" \
            -e DATABASE_URL="sqlite:////app/database/app.db" \
            "${IMAGE_NAME}"

          echo "=== Waiting for /health ==="
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/health; then
              echo
              echo "Backend container is healthy"
              exit 0
            fi
            sleep 2
          done

          echo "Backend container failed health check"
          docker logs backend-ci
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs backend-ci || true

      - name: Stop backend container
        if: always()
        run: docker rm -f backend-ci || true

  # ============================================================
  # Job 3 -- Web Frontend Test & Build
  # ============================================================
  web-frontend_test_and_build:
    name: Web-Frontend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: web-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run frontend tests
        run: CI=true npm test

      - name: Build web-frontend
        run: CI=false npm run build

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web-frontend/dist/
          retention-days: 7

  # ============================================================
  # Job 4 -- Mobile Frontend (Expo) Test & Build
  # ============================================================
  mobile_frontend:
    name: Mobile-Frontend Test & Build
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: mobile-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Mobile Tests
        run: npm run test:ci

      - name: Build Mobile Web Export
        run: CI=false npm run build:web

      - name: Upload Mobile Web Build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-web-dist
          path: mobile-frontend/dist/
          retention-days: 7

  # ============================================================
  # Job 5 -- Smart Contract Compile & Test (Hardhat)
  # ============================================================
  blockchain_tests:
    name: Smart Contract Tests
    runs-on: ubuntu-latest
    needs: code_quality

    defaults:
      run:
        working-directory: code/blockchain

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: code/blockchain/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Run contract test suite
        run: npm test

      - name: Run coverage
        run: npm run coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contracts-coverage-report
          path: code/blockchain/coverage/
          retention-days: 7
